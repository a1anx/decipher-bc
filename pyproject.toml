[tool.poetry]
name = "decipher_models"
version = "0.1.0"
packages = [{include = "decipher_models", from = "."}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
numpy = ">=1.26,<2.0"
matplotlib = ">=3.8"
scanpy = "1.10.0"
scvi-tools = ">=1.1.0"
torch = ">=2"
pandas = "^2.1.3"
scipy = "^1.11.3"
leidenalg = "^0.10.1"
pyro-ppl = "^1.8.6"
randomname = "^0.2.1"
wandb = "^0.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
